name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Fetch pinned whisper.cpp
        run: git clone --depth 1 --branch v1.8.3 https://github.com/ggml-org/whisper.cpp.git third_party/whisper.cpp
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK with dependency retries
        run: |
          for attempt in 1 2 3; do
            gradle assembleDebug --stacktrace && exit 0
            echo "Build attempt $attempt failed; retrying dependency resolution"
            sleep 12
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: easy-flow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
