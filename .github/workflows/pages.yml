name: Deploy Web Prototype
on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build downloadable APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Add APK to web prototype
        run: cp android/app/build/outputs/apk/debug/app-debug.apk web/EasyFlow-v0.10.0-Liquid-Glass.apk
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
